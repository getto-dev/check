name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun test src/lib
      - run: bun run lint
      - run: NEXT_PUBLIC_BASE_PATH=/check bun run build
      - name: Prepare GitHub Pages output
        run: touch out/.nojekyll
      - name: Verify Pages output
        run: |
          test -s out/index.html
          test -f out/.nojekyll
          find out/_next/static/chunks -name '*.js' -type f -size +0c -print -quit | grep -q .
          grep -q '/check/' out/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          retention-days: 1
          include-hidden-files: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e

  deploy:
    needs: [build, e2e]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
