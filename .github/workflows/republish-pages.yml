name: Re-publish app after GitHub Pages branch build

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-republish
  cancel-in-progress: true

jobs:
  republish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify tests
        run: bun test

      - name: Verify lint
        run: bun run lint

      - name: Build static application
        run: NEXT_PUBLIC_BASE_PATH=/checknew bun run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload application artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
          retention-days: 1

      - name: Deploy application
        uses: actions/deploy-pages@v5
